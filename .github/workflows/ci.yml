name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Embedded JDK in Bazel doesn't see the runner's CA bundle by default;
  # point it at the system trust store so MODULE.bazel resolution works.
  LOUPE_BAZEL_STARTUP_ARGS: "--host_jvm_args=-Djavax.net.ssl.trustStore=/etc/ssl/certs/java/cacerts"

jobs:
  test:
    name: build + test
    # Defaults to the self-hosted runner. To fall back to GitHub-hosted,
    # set repo variable CI_RUNNER to '["ubuntu-latest"]'.
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted"]') }}
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel; rustup picks it up automatically.
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          # Distinct from the lint job: clippy/check artifacts and
          # full-codegen build artifacts have incompatible fingerprints,
          # so sharing one slot makes each job clobber the other's cache
          # and recompile from scratch every run.
          shared-key: loupe-build

      # Bazelisk reads .bazelversion in each fixture and downloads on demand.
      # Resolve the OS/arch from uname so this works on self-hosted Linux or
      # macOS as well as the ubuntu-latest fallback, and install under $HOME
      # so no sudo is required on locked-down runners.
      - name: Install bazelisk as `bazel`
        run: |
          set -euo pipefail
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          case "$(uname -m)" in
            x86_64|amd64) arch=amd64 ;;
            arm64|aarch64) arch=arm64 ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          mkdir -p "$HOME/.local/bin"
          curl -sLo "$HOME/.local/bin/bazel" \
            "https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-${os}-${arch}"
          chmod +x "$HOME/.local/bin/bazel"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/bazel" --version

      - name: Cache Bazel installs and repo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-${{ runner.os }}-${{ hashFiles('crates/loupe-test-harness/fixtures/*/.bazelversion', 'crates/loupe-test-harness/fixtures/*/MODULE.bazel') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      # `cargo test` already compiles the whole workspace (libs, bins, and
      # test harnesses), so a separate `cargo build` step just duplicates
      # the codegen pass. `--no-fail-fast` keeps build/test errors visible.
      - name: cargo test
        run: cargo test --workspace --locked --no-fail-fast

  lint:
    name: fmt + clippy
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: loupe-lint

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
