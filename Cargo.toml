[workspace]
resolver = "2"
members = [
    "crates/loupe-core",
    "crates/loupe-cli",
    "crates/loupe-test-harness",
    "crates/loupe-bzlmod",
    "crates/loupe-labels",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/thesayyn/loupe"
rust-version = "1.94"

# Pin everything from the buck2 monorepo. Buck2 vendors starlark-rust
# under `starlark-rust/`, so all of `starlark`, `dice`, `allocative`,
# and `dupe` share one trait instance — fetching `starlark` separately
# from facebook/starlark-rust would give us two `Allocative` traits and
# a sea of E0277s. (See DETAILS.md: starlark-rust and dice "evolve with
# Buck2".) Bump these in lockstep.
[workspace.dependencies]
starlark = { git = "https://github.com/facebook/buck2.git", rev = "6b2bc30a0f6ab9302d8d2a8ee27dfbe45c19d829", package = "starlark" }
dice = { git = "https://github.com/facebook/buck2.git", rev = "6b2bc30a0f6ab9302d8d2a8ee27dfbe45c19d829", package = "dice" }
allocative = { git = "https://github.com/facebook/buck2.git", rev = "6b2bc30a0f6ab9302d8d2a8ee27dfbe45c19d829", package = "allocative" }
dupe = { git = "https://github.com/facebook/buck2.git", rev = "6b2bc30a0f6ab9302d8d2a8ee27dfbe45c19d829", package = "dupe" }
pagable = { git = "https://github.com/facebook/buck2.git", rev = "6b2bc30a0f6ab9302d8d2a8ee27dfbe45c19d829", package = "pagable" }
# Cheap-clone refcounted str/slice. The same crate `pagable`/`allocative`
# already pull in, so `triomphe::Arc<str>` is `Pagable` + `Allocative` out
# of the box and DICE-key identity types can be O(1) to clone.
triomphe = "0.1"

derive_more = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
rayon = "1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"

# CI's GH Actions runner has ~14 GB free on /home; the workspace has 35+
# test binaries each statically linking the full dep graph (starlark,
# dice, futures, rayon, reqwest, ...). With full DWARF debug info per
# binary, target/debug/deps/ blows past that and the linker fails with
# `collect2: fatal error: ld terminated with signal 7 [Bus error]` —
# SIGBUS on the linker's mmap'd intermediate file is the canonical
# out-of-disk symptom. `line-tables-only` keeps backtraces working but
# strips the bulk of the DWARF that's never read in tests.
[profile.dev]
debug = "line-tables-only"
